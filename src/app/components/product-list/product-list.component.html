<div class="flex px-10 py-4 gap-6">
  <!-- Sidebar Filter -->
  <div class="w-1/4 bg-white p-4 rounded-2xl shadow-md">
    <h5 class="text-lg font-semibold mb-4">Filters</h5>

    <!-- Category Filter -->
    <div class="mb-6">
      <mat-form-field class="w-full">
        <mat-label>Category</mat-label>
        <mat-select
          name="categoryId"
          [(ngModel)]="categoryId"
          (valueChange)="getProducts()"
        >
          @for(item of category; track $index) {
          <mat-option [value]="item._id">{{ item.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Brand Filter -->
    <div>
      <mat-form-field class="w-full">
        <mat-label>Brand</mat-label>
        <mat-select
          name="brandId"
          [(ngModel)]="brandId"
          (valueChange)="getProducts()"
        >
          @for(item of brands; track $index) {
          <mat-option [value]="item._id">{{ item.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <!-- Products Section -->
  <div class="flex-1">
    <div class="flex justify-between items-center mb-6">
      <h5 class="text-xl font-semibold">Products</h5>
      <mat-form-field class="w-48">
        <mat-label>Sort By</mat-label>
        <mat-select (valueChange)="orderChange($event)">
          <mat-option [value]="1">Price: Low to High</mat-option>
          <mat-option [value]="-1">Price: High to Low</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Products Grid -->
    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
    >
      @for(product of products; track $index) {
      <div class="bg-white p-4 rounded-lg shadow-md">
        <app-product-card [product]="product"></app-product-card>
      </div>
      } @empty {
      <h5 class="col-span-full text-center text-gray-500">No Products Found</h5>
      }
    </div>

    <!-- Pagination Controls -->
    <div class="mt-8 flex justify-center space-x-2">
      <button
        class="px-4 py-1 rounded bg-gray-300 hover:bg-gray-400 text-sm"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)"
      >
        Previous
      </button>
      <button
        *ngFor="let page of [].constructor(totalPages); let i = index"
        class="px-3 py-1 rounded border"
        [class.bg-blue-500]="currentPage === i + 1"
        [class.text-white]="currentPage === i + 1"
        (click)="goToPage(i + 1)"
      >
        {{ i + 1 }}
      </button>
      <button
        class="px-4 py-1 rounded bg-gray-300 hover:bg-gray-400 text-sm"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(currentPage + 1)"
      >
        Next
      </button>
    </div>
  </div>
</div>
