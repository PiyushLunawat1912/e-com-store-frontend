<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .thumbnail:hover {
        opacity: 0.7;
        transform: scale(1.1);
        transition: 0.3s;
      }
      .scroll-container {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding-bottom: 10px;
      }
      .scroll-item {
        flex: 0 0 auto;
        scroll-snap-align: start;
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        padding: 20px;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-all"
    *ngIf="product"
  >
    <div class="max-w-6xl mx-auto p-8">
      <button
        class="absolute top-5 right-5 bg-gray-800 text-white p-2 rounded-full"
        (click)="toggleDarkMode()"
      >
        🌙
      </button>
      <div
        class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white dark:bg-gray-800 p-8 rounded-xl shadow-xl"
      >
        <!-- Product Gallery -->
        <div class="h-full flex flex-col items-center sticky top-6">
          <img
            id="mainImage"
            [src]="mainImage"
            alt="Product Image"
            class="w-full rounded-xl shadow-lg hover:shadow-2xl transition-all hover:scale-105"
          />
          <div class="mt-6 flex space-x-4">
            @if(isProductInCart(product._id!)){
            <button
              class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow-lg hover:bg-blue-700 transition-all"
              (click)="addToCart(product)"
            >
              <mat-icon>remove_shopping_cart</mat-icon>Remove From Cart
            </button>
            }@else {
            <button
              class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow-lg hover:bg-blue-700 transition-all"
              (click)="addToCart(product)"
            >
              <mat-icon>add_shopping_cart</mat-icon>Add To Cart
            </button>
            }
            <button
              mat-fab
              color="warn"
              (click)="toggleWishlist(product)"
              class="shadow-lg hover:scale-110 transition-transform hover:shadow-xl"
            >
              <mat-icon>{{
                isInWishlist(product) ? "favorite" : "favorite_border"
              }}</mat-icon>
            </button>
          </div>
          <div class="grid grid-cols-4 gap-3 mt-6">
            <img
              *ngFor="let url of product.images; let i = index"
              [src]="url"
              alt="Thumbnail"
              class="w-full rounded-lg cursor-pointer thumbnail border border-gray-300"
              (click)="changeImage(url)"
            />
          </div>
        </div>

        <!-- Product Details -->
        <div class="flex flex-col justify-between">
          <div class="glass-effect">
            <h2 class="text-4xl font-extrabold">{{ product.name }}</h2>
            <p class="text-xl mt-2 font-semibold line-through">
              ₹{{ product.price }}
            </p>
            <p class="text-xl text-red-500 mt-2 font-semibold">
              {{ product.discount }}% OFF
            </p>
            <p class="text-2xl text-green-600 mt-2 font-bold">
              ₹{{ sellingPrice }}
            </p>
            <p class="mt-4 leading-relaxed">{{ product.shortDescription }}</p>
          </div>

          <div class="mt-8 glass-effect">
            <h3 class="text-3xl font-bold mb-4">Product Details</h3>
            <pre class="leading-relaxed">{{ product.description }}</pre>
          </div>

          <div class="mt-8" *ngIf="similarProducts.length">
            <h4 class="text-2xl font-bold mb-4">Similar Products</h4>
            <div class="scroll-container space-x-4 p-2 bg-gray-100 rounded-lg">
              <div
                *ngFor="let product of similarProducts; let i = index"
                class="scroll-item w-60 bg-white rounded-lg shadow-lg p-4 hover:shadow-2xl transition"
              >
                <app-product-card [product]="product"></app-product-card>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <ng-template #loading>
      <div class="text-center text-2xl font-semibold mt-10 animate-pulse">
        Loading...
      </div>
    </ng-template>
  </body>
</html>
