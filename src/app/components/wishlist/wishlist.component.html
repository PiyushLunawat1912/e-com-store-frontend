<div class="max-w-xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-10">
  <h2 class="text-xl font-bold mb-4">My Wishlist</h2>
  <div class="flex flex-wrap" *ngIf="wishlist.length; else emptyWishlist">
    <div *ngFor="let item of wishlist; trackBy: trackByFn">
      <app-product-card *ngIf="item" [product]="item"></app-product-card>
    </div>
  </div>
  <ng-template #emptyWishlist>
    <p class="text-gray-500 text-center">No items in wishlist</p>
  </ng-template>
</div>
